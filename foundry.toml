[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"           # v4 uses transient storage (Cancun)
ffi = false
fs_permissions = [{ access = "read", path = "./"}]

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

# Robinhood Chain: mainnet chainId 4663, testnet 46630. Native = ETH. Uniswap v2/v3/v4 deployed.
